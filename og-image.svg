<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080a0d"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#e8c96a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="630"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="1200" height="630" fill="url(#bg)"/>
    <!-- Subtle grid lines -->
    <line x1="0" y1="315" x2="1200" y2="315" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <!-- Gold accent bar top -->
    <rect x="0" y="0" width="1200" height="4" fill="url(#gold)"/>
    <!-- Gold glow top -->
    <rect x="0" y="4" width="1200" height="80" fill="url(#glow)"/>
    <!-- Left accent line -->
    <rect x="80" y="120" width="3" height="320" fill="url(#gold)" opacity="0.7"/>
    <!-- Right decorative circles -->
    <circle cx="1050" cy="180" r="180" fill="none" stroke="rgba(201,168,76,0.07)" stroke-width="1"/>
    <circle cx="1050" cy="180" r="130" fill="none" stroke="rgba(201,168,76,0.05)" stroke-width="1"/>
    <circle cx="1050" cy="180" r="80"  fill="none" stroke="rgba(201,168,76,0.08)" stroke-width="1"/>
    <!-- Eyebrow label -->
    <text x="110" y="175" font-family="Courier New, monospace" font-size="16" letter-spacing="4" fill="#c9a84c" text-anchor="start" opacity="0.85">UZOUKWU ERIC IKENNA</text>
    <!-- Name -->
    <text x="108" y="280" font-family="Georgia, serif" font-size="78" font-weight="700" fill="#eceae4" text-anchor="start" letter-spacing="-1">Cybersecurity.</text>
    <text x="108" y="370" font-family="Georgia, serif" font-size="78" font-weight="700" fill="url(#gold)" text-anchor="start" letter-spacing="-1">Founder. Builder.</text>
    <!-- Divider -->
    <rect x="108" y="405" width="560" height="1.5" fill="rgba(201,168,76,0.3)"/>
    <!-- Role tags -->
    <text x="110" y="445" font-family="Courier New, monospace" font-size="17" fill="rgba(236,234,228,0.55)" letter-spacing="1">Founder &amp; COO, E World Fortress LTD</text>
    <text x="110" y="472" font-family="Courier New, monospace" font-size="17" fill="rgba(236,234,228,0.55)" letter-spacing="1">Co-Founder, 4First Technologies &amp; Terbana Ltd</text>
    <text x="110" y="499" font-family="Courier New, monospace" font-size="17" fill="rgba(236,234,228,0.55)" letter-spacing="1">Cybersecurity Instructor · Project Manager · QA Lead</text>
    <!-- Bottom stat row -->
    <rect x="108" y="555" width="120" height="1" fill="rgba(201,168,76,0.25)"/>
    <text x="108" y="590" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#c9a84c">7+</text>
    <text x="145" y="590" font-family="Courier New, monospace" font-size="12" fill="rgba(236,234,228,0.45)" letter-spacing="1"> Ventures</text>
    <text x="280" y="590" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#c9a84c">17+</text>
    <text x="320" y="590" font-family="Courier New, monospace" font-size="12" fill="rgba(236,234,228,0.45)" letter-spacing="1"> Products Built</text>
    <text x="490" y="590" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#c9a84c">10+</text>
    <text x="530" y="590" font-family="Courier New, monospace" font-size="12" fill="rgba(236,234,228,0.45)" letter-spacing="1"> Projects Delivered</text>
    <!-- URL -->
    <text x="1100" y="600" font-family="Courier New, monospace" font-size="15" fill="rgba(201,168,76,0.6)" text-anchor="end" letter-spacing="1">uzoukwuericikenna.com</text>
    <!-- Bottom gold bar -->
    <rect x="0" y="626" width="1200" height="4" fill="url(#gold)"/>
  </g>
</svg>